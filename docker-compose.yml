services:
  db:
    image: postgres:17-alpine # match the RDS major version
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5433:5432" # 5433 avoids clashing with a local Postgres
    volumes:
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro # creates scheduler_test
    healthcheck:
      # -h forces TCP, so the check stays red while the init scripts run
      # against the entrypoint's socket-only temporary server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U scheduler -d scheduler"]
      interval: 2s
      retries: 15

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@db:5432/scheduler?sslmode=disable
      SEED_FILE: /data/appointments.json
    volumes:
      # Mounted rather than copied, so the image carries no fixture data.
      - ./appointments.json:/data/appointments.json:ro
    ports:
      - "8080:8080"

  # For reviewers without Go: docker compose --profile test run --rm test
  test:
    profiles: [test]
    image: golang:1.27
    depends_on:
      db:
        condition: service_healthy
    working_dir: /src
    volumes:
      - .:/src
    environment:
      TEST_DATABASE_URL: postgres://scheduler:scheduler@db:5432/scheduler_test?sslmode=disable
    command: go test -race -count=1 -p 1 ./...
